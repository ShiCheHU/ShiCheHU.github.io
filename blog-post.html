<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <title>Shicheng Hu - Blog Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="stylesheets/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-light.min.css">
  </head>
  <body>
    <div class="markdown-shell">
      <header>
        <div class="lang-toggle">
          <button type="button" data-lang-switch="en">English</button>
          <button type="button" data-lang-switch="zh">中文</button>
        </div>
        <p><a href="blog.html" data-lang="en">← Back to blog</a><a href="blog.html" data-lang="zh">← 返回博客</a></p>
      </header>
      <article id="markdown-container" class="markdown-body"></article>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="javascripts/site.js"></script>
    <script>
      function getParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      const langFromUrl = getParam('lang') || localStorage.getItem('site-lang') || 'en';
      siteLang.initLanguageToggle(langFromUrl);
      const post = getParam('post') || 'ai-csi-compression';
      const mdPath = `blog/posts/${langFromUrl}/${post}.md`;

      fetch(mdPath)
        .then((response) => {
          if (!response.ok) throw new Error('Markdown file not found: ' + mdPath);
          return response.text();
        })
        .then((md) => {
          document.getElementById('markdown-container').innerHTML = marked.parse(md);
          document.title = document.querySelector('#markdown-container h1')?.textContent || 'Blog Post';
        })
        .catch((err) => {
          document.getElementById('markdown-container').innerHTML = `<h1>Not Found</h1><p>${err.message}</p>`;
        });

      document.querySelectorAll('[data-lang-switch]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const nextLang = btn.getAttribute('data-lang-switch');
          const url = new URL(window.location.href);
          url.searchParams.set('lang', nextLang);
          window.location.href = url.toString();
        });
      });
    </script>
  </body>
</html>
