<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <title>Shicheng Hu - Technical Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="stylesheets/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-light.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  </head>
  <body>
    <div class="markdown-shell">
      <header>
        <div class="lang-toggle">
          <button type="button" data-lang-switch="en">English</button>
          <button type="button" data-lang-switch="zh">中文</button>
        </div>
        <p><a href="blog.html" data-lang="en">← Back to blog</a><a href="blog.html" data-lang="zh">← 返回博客</a></p>
      </header>
      <article id="markdown-container" class="markdown-body"></article>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="javascripts/site.js"></script>
    <script>
      function getParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      siteLang.initLanguageToggle('zh');

      const file = getParam('file');
      if (!file) {
        document.getElementById('markdown-container').innerHTML = '<h1>Error</h1><p>No file specified.</p>';
      } else {
        fetch(file)
          .then((response) => {
            if (!response.ok) throw new Error('Markdown file not found: ' + file);
            return response.text();
          })
          .then((md) => {
            document.getElementById('markdown-container').innerHTML = marked.parse(md);
            document.title = document.querySelector('#markdown-container h1')?.textContent || 'Technical Notes';
            // Render LaTeX math
            renderMathInElement(document.getElementById('markdown-container'), {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\[', right: '\\]', display: true},
                {left: '\\(', right: '\\)', display: false}
              ],
              throwOnError: false
            });
          })
          .catch((err) => {
            document.getElementById('markdown-container').innerHTML = '<h1>Not Found</h1><p>' + err.message + '</p>';
          });
      }
    </script>
  </body>
</html>
